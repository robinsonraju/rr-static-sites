<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Table Builder | Dev Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <header>
            <div class="header-left">
                <a href="../../index.html" class="back-link">← Back to Tools</a>
                <h1>Markdown Table Builder</h1>
            </div>
            <div class="header-right">
                <p>Visually create nicely-formatted Markdown tables.</p>
            </div>
        </header>

        <main class="main-content">
            <!-- Toolbar -->
            <div class="toolbar card">
                <div class="tool-group">
                    <label>Grid Size</label>
                    <div class="btn-group">
                        <button id="add-row-btn" class="secondary-btn">+ Row</button>
                        <button id="del-row-btn" class="secondary-btn danger">- Row</button>
                        <span class="divider"></span>
                        <button id="add-col-btn" class="secondary-btn">+ Col</button>
                        <button id="del-col-btn" class="secondary-btn danger">- Col</button>
                    </div>
                </div>
                
                <div class="tool-group">
                    <label>Actions</label>
                    <div class="btn-group">
                        <button id="clear-btn" class="secondary-btn danger">Clear Data</button>
                    </div>
                </div>
            </div>

            <div class="split-layout">
                <!-- Visual Editor -->
                <section class="editor-section card">
                    <h2>Visual Editor</h2>
                    <div class="table-container">
                        <table id="visual-table">
                            <thead>
                                <tr id="table-head-row">
                                    <!-- Headers generated by JS -->
                                </tr>
                            </thead>
                            <tbody id="table-body">
                                <!-- Rows generated by JS -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- Markdown Output -->
                <section class="output-section card flex-column">
                    <div class="section-header">
                        <h2>Markdown Output</h2>
                        <button id="copy-btn" class="primary-btn">Copy to Clipboard</button>
                    </div>
                    <textarea id="markdown-output" class="code-font" readonly></textarea>
                </section>
            </div>
            
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
