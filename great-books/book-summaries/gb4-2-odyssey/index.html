    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f9ff; color: #292524; }

        .book-card { transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; justify-content: space-between; min-height: 250px; }

<body class="bg-sky-50 text-stone-800 p-4 sm:p-8">
    <header class="max-w-7xl mx-auto mb-12 relative text-center">

        </a>
        <h1 class="text-4xl sm:text-5xl font-bold mb-2">The Odyssey</h1>
        <p class="text-xl text-stone-600">The ten-year journey of Odysseus</p>
    </header>
    <main class="max-w-7xl mx-auto">
        <div class="text-center py-20 bg-white rounded-xl shadow-lg border-t-4 border-sky-500">
